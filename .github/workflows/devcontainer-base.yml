name: devcontainer-base

# Builds the dev container base image (devcontainer-base/) for amd64 and arm64: on PRs
# to check it still builds, and on main to publish it to
# ghcr.io/amcaughan-personal/devcontainer-base. Repos pin it by digest; Dependabot bumps them.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ["devcontainer-base/**", ".github/workflows/devcontainer-base.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # to publish to GHCR on main
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/devcontainer-base
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and publish on main)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: devcontainer-base
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Base image for the amcaughan-personal dev containers

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ "$PUBLISH" == true ]]; then
            echo "Published \`$IMAGE:latest@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Built for amd64 and arm64 (not published from a PR)" >> "$GITHUB_STEP_SUMMARY"
          fi
