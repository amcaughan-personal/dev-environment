name: security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: amcaughan-personal/shared-workflows/.github/workflows/security-scan.yml@299c2f6e41e4dec27a67978c68e1798981914041 # v1.0.1
    permissions:
      contents: read
      pull-requests: write # to comment when there are findings
    with:
      scans: "checkov, trivy, gitleaks, actionlint"
